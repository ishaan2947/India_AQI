# Backend CI — lint, type-check, and test every pull request.
#
# Why a PR trigger rather than push-to-main: the point is to catch a
# regression *before* it reaches the branch Render deploys from. Pushes to
# main are covered too, so a direct commit (or a merge that lands without
# a PR run) still gets checked.
#
# The three gates run as separate steps rather than one chained command so
# a failure names itself in the Actions UI — "mypy" is a more useful red X
# than "make check". They're ordered cheapest-first: ruff is a couple of
# seconds, mypy about ten, pytest the rest.
#
# Runs entirely on GitHub-hosted runners — free for public repos.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same PR makes the in-flight run obsolete, so cancel
# it. `github.ref` keeps main's runs in their own group, where cancelling
# is not wanted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This workflow only inspects code — unlike refresh-snapshot,
# it has no reason to be able to write to the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the `target-version` / `python_version` pinned in
          # pyproject, so CI can't pass on syntax the local venv rejects.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        # The suite never opens a socket and builds its own in-memory
        # SQLite, so there is nothing to provision and no secret to inject.
        # DATABASE_URL is set anyway as a belt-and-braces guarantee that a
        # stray import can't create a stray file on the runner.
        env:
          DATABASE_URL: "sqlite://"
        run: pytest
