<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AQI India – the air over thirty Indian cities, right now, with 24-hour forecasts." />

    <!-- PWA -->
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="application-name" content="AQI India" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AQI India" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <title>AQI India — the air, right now</title>

    <!-- Archivo (variable grotesk, width axis) for display + data; Newsreader
         (variable serif) for prose. See DESIGN.md §4 — the width axis is the
         reason Archivo is here, so the weight *and* wdth ranges both ship. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap"
      rel="stylesheet"
    />

    <!-- The hero photograph is the first paint on the landing page; without
         this the browser doesn't discover it until React has mounted. -->
    <link
      rel="preload"
      as="image"
      href="/hero-taj-1600.webp"
      imagesrcset="/hero-taj-900.webp 900w, /hero-taj-1600.webp 1600w, /hero-taj-2400.webp 2400w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-smoke-950 text-smoke-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
